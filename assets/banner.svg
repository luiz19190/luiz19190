<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Luiz Trajano, Data Analyst in Porto. SQL, Python, Tableau.">
  <style>
    .grid { stroke: #17211c; stroke-width: 1; }
    .kicker { fill: #4cc38a; font: 600 17px Consolas, 'Courier New', monospace; letter-spacing: 4px; opacity: 0; animation: fade .8s ease-out .2s forwards; }
    .name { fill: #e8efea; font: 700 66px 'Segoe UI', Helvetica, Arial, sans-serif; opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    .sub { fill: #9fb0a7; font: 400 25px 'Segoe UI', Helvetica, Arial, sans-serif; opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) .7s forwards; }
    .loc { fill: #5f7068; font: 400 16px Consolas, 'Courier New', monospace; opacity: 0; animation: fade .8s ease-out 1.1s forwards; }
    .bar { fill: #4cc38a; transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.2,.7,.2,1) forwards, breathe 4s ease-in-out 2.4s infinite; }
    .line { fill: none; stroke: #e8efea; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 1.8s ease-out 1.2s forwards; }
    .dot { fill: #4cc38a; opacity: 0; animation: fade .3s ease-out 2.9s forwards, pulse 2.2s ease-in-out 3.2s infinite; transform-box: fill-box; transform-origin: center; }
    .lbl { fill: #4cc38a; font: 600 15px Consolas, 'Courier New', monospace; opacity: 0; animation: fade .5s ease-out 3s forwards; }
    .scan { fill: url(#scan); animation: sweep 6s linear 3s infinite; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.9); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
    @keyframes sweep { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
  </style>
  <defs>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#4cc38a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4cc38a" stop-opacity=".07"/>
      <stop offset="1" stop-color="#4cc38a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#0d1210"/>
  <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320M900 0V320M1050 0V320"/>
  <rect class="scan" x="0" y="0" width="200" height="320"/>

  <text class="kicker" x="64" y="96">DATA ANALYST · PORTO, PORTUGAL</text>
  <text class="name" x="60" y="178">Luiz Trajano</text>
  <text class="sub" x="64" y="224">SQL · Python · Tableau · A/B tests · cohorts · churn</text>
  <text class="loc" x="64" y="270">$ luiz-data.com  --open-to-work</text>

  <g>
    <rect class="bar" x="770" y="226" width="34" height="34" opacity=".25" style="animation-delay:.3s,2.4s"/>
    <rect class="bar" x="820" y="206" width="34" height="54" opacity=".32" style="animation-delay:.4s,2.6s"/>
    <rect class="bar" x="870" y="214" width="34" height="46" opacity=".4" style="animation-delay:.5s,2.8s"/>
    <rect class="bar" x="920" y="180" width="34" height="80" opacity=".5" style="animation-delay:.6s,3s"/>
    <rect class="bar" x="970" y="160" width="34" height="100" opacity=".62" style="animation-delay:.7s,3.2s"/>
    <rect class="bar" x="1020" y="120" width="34" height="140" opacity=".8" style="animation-delay:.8s,3.4s"/>
    <rect class="bar" x="1070" y="84" width="34" height="176" style="animation-delay:.9s,3.6s"/>
  </g>
  <path class="line" d="M787 214 L837 192 L887 200 L937 160 L987 138 L1037 96 L1087 58"/>
  <circle class="dot" cx="1087" cy="58" r="6"/>
  <text class="lbl" x="1000" y="44">insight ↗</text>
</svg>
